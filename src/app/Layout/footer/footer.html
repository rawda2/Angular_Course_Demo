<footer class="footer">
    <div class="container">

        <!-- Footer Bottom -->
        <div class="footer-bottom">
            <div class="copyright">
                <p>&copy; {{ currentYear }} Angular Demo Store. All Rights Reserved.</p>
            </div>
            <div class="footer-meta">
                <p class="current-time">
                    🕐 {{ currentDate | date:'fullDate' }}
                </p>
                <p class="made-with">
                    Made with ❤️ for learning Angular
                </p>
            </div>
        </div>

        <!-- Scroll to Top Button -->
        <button class="scroll-top" (click)="scrollToTop()" aria-label="Scroll to top">
            ↑
        </button>
    </div>
</footer>
