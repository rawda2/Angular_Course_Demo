<div class="container mx-auto px-4 py-8 max-w-7xl">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
                Our Products
            </h1>
            <p class="text-gray-600 mt-1">Browse our collection of amazing products</p>
        </div>

        <button routerLink="/products/add" class="btn-primary flex items-center gap-2">
            <span >➕</span> Add New Product
        </button>
    </div>

    <!-- Filters Section -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-8">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Filter Products</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

            <!-- Category Filter -->
            <div>
                <label for="" class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                <select [(ngModel)]="filters.category" (ngModelChange)="applyFilters()" class="input-field">
                    <option value="">All Categories</option>
                    @for (category of categories(); track category) {
                    <option [value]="category">{{ category }}</option>
                    }
                </select>
            </div>

          
        </div>
    </div>

    <!-- Loading State -->
    @if (isLoading()) {
    <div class="flex justify-center items-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
    </div>
    } @else {
    <!-- Products Grid -->
    @if (filteredProducts().length > 0) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (product of filteredProducts(); track product.id) {
        <app-product-card [product]="product" (viewDetails)="viewProductDetails($event)" (edit)="editProduct($event)"
            (delete)="deleteProduct($event)" />
        }
    </div>
    } @else {
    <!-- Empty State -->
    <div class="text-center py-20 bg-white rounded-xl shadow-md">
        <div class="text-6xl mb-4">🛒</div>
        <h3 class="text-xl font-semibold text-gray-800 mb-2">No Products Found</h3>
        <p class="text-gray-600">Try adjusting your filters or add a new product</p>
        <button routerLink="/products/add" class="btn-primary mt-4">
            Add Your First Product
        </button>
    </div>
    }
    }
</div>
