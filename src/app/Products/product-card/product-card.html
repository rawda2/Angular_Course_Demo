<div
    class="bg-white rounded-xl shadow-lg overflow-hidden transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 animate-fade-in">
    <!-- Product Image Section -->
    <div class="relative overflow-hidden h-56 bg-gradient-to-br from-purple-100 to-indigo-100">
        <img [src]="product().imageUrl || 'https://picsum.photos/id/1/400/300'" [alt]="product().name"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />

        <!-- Stock Status Badge -->
        <div class="absolute top-3 right-3">
            @if (!product().inStock) {
            <span class="px-2.5 py-1 bg-red-500 text-white text-xs font-bold rounded-full shadow-lg">
                Out of Stock
            </span>
            } @else {
            <span class="px-2.5 py-1 bg-green-500 text-white text-xs font-bold rounded-full shadow-lg">
                In Stock
            </span>
            }
        </div>

        <!-- Category Badge -->
        <div class="absolute top-3 left-3">
            <span class="px-2 py-1 bg-purple-600/90 backdrop-blur-sm text-white text-xs rounded-full">
                {{ product().category }}
            </span>
        </div>
    </div>

    <!-- Product Info Section -->
    <div class="p-5">
        <h3 class="text-lg font-bold text-gray-800 mb-2 line-clamp-1">
            {{ product().name }}
        </h3>

        <p class="text-gray-600 text-sm mb-3 line-clamp-2">
            {{ product().description }}
        </p>

        <div class="flex items-center justify-between mb-4">
            <div class="text-2xl font-bold text-purple-600">
                \${{ product().price }}
                <span class="text-sm text-gray-400 font-normal">USD</span>
            </div>

            @if (product().rating) {
            <div class="flex items-center gap-1">
                <span class="text-yellow-400">★</span>
                <span class="text-sm text-gray-600">{{ product().rating }}</span>
            </div>
            }
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2">
            <button (click)="onViewDetails()"
                class="flex-1 px-3 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all text-sm font-medium">
                View Details
            </button>

            <button (click)="onEdit()"
                class="px-3 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-all">
                ✏️
            </button>

            <button (click)="onDelete()"
                class="px-3 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all">
                🗑️
            </button>
        </div>
    </div>
</div>
